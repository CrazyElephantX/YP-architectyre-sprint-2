name: API Tests

on:
  push:
    branches: [ main, master, cinema]
  pull_request:
    branches: [ main, master, cinema]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to run tests against'
        required: true
        default: 'docker'
        type: choice
        options:
          - local
          - docker
      test_folder:
        description: 'Test folder to run (leave empty for all)'
        required: false
        type: string

jobs:
  api-tests:
    name: Run API Tests
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Docker Compose
        run: |
          docker compose --version
      
      - name: Start services with Docker Compose
        run: |
          # Start services with Docker Compose
          docker compose up -d postgres zookeeper kafka
          echo "Waiting for Kafka to be ready..."
          sleep 30
          
          # Create Kafka topics
          docker compose up -d kafka-topics-creator
          echo "Waiting for Kafka topics to be created..."
          sleep 15
          
          # Start application services
          docker compose up -d monolith movies-service events-service
          echo "Waiting for application services to be ready..."
          sleep 60
          
          # Start proxy service
          docker compose up -d proxy-service
          echo "Waiting for proxy service to be ready..."
          sleep 30
      
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: tests/postman/package-lock.json
      
      - name: Install Newman and dependencies
        working-directory: tests/postman
        run: npm install
      
      - name: Run API tests
        working-directory: tests/postman
        run: |
          # Build the Docker image
          docker build -t cinemaabyss-api-tests .
          
          # Run the tests in Docker with the same network as services
          docker run --network=cinemaabyss-network -v "$(pwd)/reports:/app/reports" cinemaabyss-api-tests --environment docker --timeout 30000
      
      - name: Stop services
        if: always()
        run: docker compose down